<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My Tasks</h1>
    <p class="subtitle">Write it down, tick it off.</p>

    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input type="text" id="task-input" placeholder="What needs doing?" autocomplete="off" required>
      <button type="submit" class="btn btn-primary">Add Task</button>
    </form>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-message" class="empty">No tasks yet... Add your first one above.</p>

    <footer class="footer">
      <span id="counter">0 tasks pending</span>
      <button id="clear-all" class="btn btn-danger" type="button">Clear All</button>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
